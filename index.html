<meta name="twitter:description" content="Propuesta de diseño — pasa hoja a hoja.">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050810; --surface:#0c1424; --brand:#2B5BFF; --brand2:#5fb8ff;
  --ink:#0A0F1C; --paper:#FFFFFF; --cream:#F2F1EF; --line:#C9CED8; --muted:#7A8396;
  --cover:#050810; --cover-ink:#FFFFFF;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,.book{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{overscroll-behavior:none;-webkit-user-select:none;user-select:none}
body{background:var(--bg);color:#fff;font-family:Inter,system-ui,sans-serif;overflow:hidden;
  background-image:radial-gradient(ellipse 60% 50% at 50% 45%,rgba(31,123,224,.22),transparent 70%),radial-gradient(ellipse 40% 30% at 85% 10%,rgba(95,184,255,.10),transparent 70%);}

/* ---------- chrome ---------- */
.top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;z-index:20;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .lg{width:92px;height:46px;background:#fff;-webkit-mask:url(logo.png) center/contain no-repeat;mask:url(logo.png) center/contain no-repeat;flex:none}
.brand .t{font:500 11px/1.3 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.6);border-left:1px solid rgba(255,255,255,.18);padding-left:12px}
.brand .t b{display:block;color:#fff;font-weight:500}
.swatches{display:flex;align-items:center;gap:8px;font:500 10px 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.25);cursor:pointer;transition:transform .2s,border-color .2s}
@media (hover:hover){.sw:hover{transform:scale(1.12)}}
.sw.on{border-color:#fff;box-shadow:0 0 0 3px rgba(95,184,255,.35)}

.stage{position:fixed;left:0;right:0;top:76px;bottom:132px;display:flex;align-items:center;justify-content:center}
.bookwrap{position:relative;transform-origin:center center}
.book{position:relative;width:840px;height:648px;perspective:2600px;transition:transform .6s cubic-bezier(.4,.1,.2,1)}
.half{position:absolute;top:0;width:420px;height:648px}
.half.l{left:0}.half.r{left:420px}
.half:empty{display:none}
.half .page{box-shadow:0 30px 60px -20px rgba(0,0,0,.6),0 8px 20px rgba(0,0,0,.35)}
.half.l .page::after,.half.r .page::after{content:"";position:absolute;top:0;bottom:0;width:40px;pointer-events:none;z-index:5}
.half.l .page::after{right:0;background:linear-gradient(to left,rgba(0,0,0,.14),transparent)}
.half.r .page::after{left:0;background:linear-gradient(to right,rgba(0,0,0,.16),transparent)}
.half.l .page.cov::after,.half.r .page.cov::after{display:none}
.leaf{position:absolute;top:0;width:420px;height:648px;transform-style:preserve-3d;display:none;z-index:10}
.leaf .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.leaf .back{transform:rotateY(180deg)}
.leaf .face::before{content:"";position:absolute;inset:0;z-index:6;pointer-events:none;opacity:0;background:linear-gradient(to right,rgba(0,0,0,.25),transparent 60%);transition:opacity .35s}
.leaf.mid .face::before{opacity:1}

.nav{position:fixed;bottom:0;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 16px calc(18px + env(safe-area-inset-bottom));z-index:20}
.top{padding-top:calc(14px + env(safe-area-inset-top))!important}
.navrow{display:flex;align-items:center;gap:14px}
.btn{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;font-size:18px;cursor:pointer;display:grid;place-items:center;transition:background .2s,transform .2s}
@media (hover:hover){.btn:hover{background:var(--brand);border-color:var(--brand)}}
.btn:active{background:var(--brand);border-color:var(--brand)}
.btn:disabled{opacity:.3;pointer-events:none}
.count{font:500 12px 'JetBrains Mono',monospace;letter-spacing:.08em;color:rgba(255,255,255,.75);min-width:170px;text-align:center}
.count b{color:#fff;font-weight:500}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{font:500 10px 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.14);border-radius:50px;padding:6px 11px;cursor:pointer;background:transparent;transition:all .2s}
@media (hover:hover){.chip:hover{color:#fff;border-color:rgba(255,255,255,.4)}}
.chip.on{background:#fff;color:var(--bg);border-color:#fff}
.btn.sm{width:36px;height:36px;font-size:14px}
.btn svg{width:16px;height:16px}
.scrub{display:none;width:min(320px,82vw);-webkit-appearance:none;appearance:none;height:3px;border-radius:3px;background:rgba(255,255,255,.18);outline:none}
.scrub::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:4px solid var(--brand);box-shadow:0 2px 8px rgba(0,0,0,.4)}
.scrub::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:4px solid var(--brand)}
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(5,8,16,.88);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;font:500 12px Inter;padding:12px 18px;border-radius:50px;z-index:40;pointer-events:none;opacity:0;transition:opacity .4s;white-space:nowrap}
.toast.on{opacity:1}
.zoom{position:fixed;inset:0;z-index:50;background:rgba(5,8,16,.97);display:none;overflow:auto;-webkit-overflow-scrolling:touch;user-select:auto;-webkit-user-select:auto}
.zoom.on{display:block}
.zoom .sizer{position:relative;margin:0 auto}
.zoom .zin{position:absolute;top:0;left:0;width:420px;height:648px;transform-origin:0 0}
.zoom .zin .zp{position:absolute;top:0;width:420px;height:648px}
.zbar{position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;display:flex;gap:8px;z-index:51}
.zbar .btn{background:rgba(5,8,16,.8);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hint{position:fixed;right:20px;bottom:24px;font:400 10px 'JetBrains Mono',monospace;letter-spacing:.1em;color:rgba(255,255,255,.35);text-transform:uppercase}

/* ---------- pages (design size 420x648 = 140x216mm @3px/mm) ---------- */
.page{position:absolute;inset:0;background:var(--paper);color:var(--ink);overflow:hidden;font-family:Inter,sans-serif}
.mono{font-family:'JetBrains Mono',monospace}
.lbl{font:500 7px 'JetBrains Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--ink)}
.lbl.r{text-align:right}
.mark{position:absolute;bottom:18px;left:50%;width:14px;height:14px;margin-left:-7px;background:var(--ink);-webkit-mask:url(isotipo.png) center/contain no-repeat;mask:url(isotipo.png) center/contain no-repeat;opacity:.85}
.iso{background:currentColor;-webkit-mask:url(isotipo.png) center/contain no-repeat;mask:url(isotipo.png) center/contain no-repeat}
.logo{background:currentColor;-webkit-mask:url(logo.png) center/contain no-repeat;mask:url(logo.png) center/contain no-repeat}

/* cover */
.cov{background:var(--cover);color:var(--cover-ink);transition:background .5s,color .5s;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),0 40px 80px -20px rgba(0,0,0,.9),0 0 0 1px rgba(95,184,255,.12)!important}
.cov::before{content:'';position:absolute;top:0;bottom:0;left:0;width:10px;background:linear-gradient(to right,rgba(0,0,0,.25),transparent);z-index:2}
.cov .title{position:absolute;top:44%;left:0;right:0;text-align:center;font:400 13px/1.55 'Archivo Black',sans-serif;letter-spacing:.42em;padding-left:.42em}
.cov .title small{display:block;font:500 7px 'JetBrains Mono',monospace;letter-spacing:.3em;opacity:.6;margin-top:14px}
.cov .logo{position:absolute;bottom:40px;left:50%;width:96px;height:48px;margin-left:-48px}
.cov .isoBig{position:absolute;top:84px;left:50%;width:42px;height:42px;margin-left:-21px}
.cov .grain{position:absolute;inset:0;background:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.08),transparent 60%),radial-gradient(ellipse at 80% 90%,rgba(0,0,0,.25),transparent 60%);pointer-events:none}
.backcov .tag{position:absolute;bottom:44px;left:0;right:0;text-align:center;font:500 7px 'JetBrains Mono',monospace;letter-spacing:.3em;opacity:.55}
.backcov .q{position:absolute;top:42%;left:60px;right:60px;text-align:center;font:400 10px/1.7 Inter;letter-spacing:.06em;opacity:.8}

/* endpaper */
.guard{background:var(--brand);color:rgba(255,255,255,.16)}
.guard .pat{position:absolute;inset:-20px;display:grid;grid-template-columns:repeat(7,1fr);gap:22px 10px;padding:16px;transform:rotate(-8deg) scale(1.15)}
.guard .pat i{display:block;aspect-ratio:1;width:70%;margin:auto}
.guard .pat i:nth-child(2n){opacity:.45;transform:scale(.7)}

/* quote pages */
.quote{position:absolute;top:30%;left:52px;right:52px;text-align:center;font:400 30px/1.12 'Archivo Black',sans-serif;letter-spacing:-.5px;color:var(--ink)}
.quote em{font-style:normal;color:var(--brand)}
.quote-sub{position:absolute;top:calc(30% + 170px);left:0;right:0;text-align:center}

/* owner page */
.own{position:absolute;top:120px;left:52px;right:52px}
.own .iso{width:34px;height:34px;color:var(--brand);margin:0 auto 40px}
.own .field{margin-bottom:30px}
.own .field .ln{height:26px;border-bottom:1px solid var(--ink)}
.own .field .lbl{margin-top:6px;color:var(--muted)}
.own .foot{margin-top:64px;text-align:center;font:400 9px/1.6 Inter;color:var(--muted)}

/* how-to */
.pad{position:absolute;inset:44px 36px 48px}
.band{display:inline-block;background:var(--ink);color:#fff;font:500 7px 'JetBrains Mono',monospace;letter-spacing:.22em;text-transform:uppercase;padding:6px 10px}
.h2{font:400 26px/1.05 'Archivo Black',sans-serif;letter-spacing:-.6px;margin:18px 0 8px}
.lead{font:400 9px/1.6 Inter;color:#3c4456;max-width:300px}
.steps{margin-top:22px;display:grid;gap:12px}
.step{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;border-top:1px solid var(--line);padding-top:12px}
.step .n{font:400 20px 'Archivo Black';color:var(--brand);line-height:1}
.step b{display:block;font:600 10px Inter;margin-bottom:3px}
.step span{font:400 8.5px/1.55 Inter;color:#4a5263}

/* goals */
.gbox{border:1px solid var(--ink);border-radius:2px;padding:10px 12px;margin-top:12px}
.gbox .lines i{display:block;height:22px;border-bottom:1px solid var(--line)}
.grow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.money{display:flex;align-items:flex-end;gap:6px;margin-top:6px}
.money span{font:400 24px 'Archivo Black';color:var(--brand);line-height:1}
.money i{flex:1;height:26px;border-bottom:1.5px solid var(--ink)}
.habit{display:flex;align-items:center;gap:8px;height:24px;border-bottom:1px solid var(--line)}
.habit .ck{width:9px;height:9px;border:1px solid var(--ink);flex:none}
.sign{margin-top:18px;display:flex;justify-content:space-between;gap:20px}
.sign div{flex:1}
.sign i{display:block;height:24px;border-bottom:1px solid var(--ink)}

/* stickers */
.stk{position:absolute;inset:30px 22px 46px;display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:1fr;gap:8px;align-items:center;justify-items:center}
.dot{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;text-align:center;font:400 5.4px/1.15 'Archivo Black';letter-spacing:.06em;text-transform:uppercase;padding:4px}
.dot svg{width:24px;height:24px}
.tabs-head{position:absolute;top:0;left:0;right:0;height:42px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:flex-end;padding:0 22px}
.tabs-txt{position:absolute;top:66px;left:36px;right:36px;font:400 8px/1.7 Inter;letter-spacing:.08em;color:#3c4456}
.tabs{position:absolute;top:120px;left:0;right:0;bottom:60px;display:grid;grid-template-columns:1fr 1fr;justify-items:center}
.tabcol{display:flex;flex-direction:column;justify-content:space-between;height:100%}
.tab{width:22px;height:52px;display:grid;place-items:center;border-radius:1px}
.tab svg{width:12px;height:12px}

/* calendars */
.calhead{position:absolute;top:0;left:0;right:0;height:42px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:flex-end;padding:0 22px;font:500 8px 'JetBrains Mono';letter-spacing:.3em}
.cal{position:absolute;top:70px;left:24px;right:24px;bottom:56px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:8px 14px}
.mo .mn{font:500 7.2px 'JetBrains Mono';letter-spacing:.24em;text-align:center;margin-bottom:6px;text-transform:uppercase}
.mo .gr{display:grid;grid-template-columns:repeat(7,1fr);row-gap:4.5px;font:400 6.6px Inter;text-align:center;color:#2b3242}
.mo .gr .d{font:600 6px 'JetBrains Mono';color:var(--muted)}
.mo .gr .we{color:var(--brand)}

/* daily */
.dly{position:absolute;inset:26px 24px 44px}
.dtop{display:flex;justify-content:space-between;align-items:flex-start}
.dtop .band{margin-top:2px}
.date{border:1px solid var(--ink)}
.date .wk{display:grid;grid-template-columns:repeat(7,13px);border-bottom:1px solid var(--ink)}
.date .wk span{font:500 6px 'JetBrains Mono';text-align:center;line-height:13px;border-right:1px solid var(--ink)}
.date .wk span:last-child{border-right:0}
.date .dm{display:grid;grid-template-columns:repeat(3,1fr);padding:3px 6px 6px;font:400 6px 'JetBrains Mono';color:var(--muted);text-align:center}
.date .dm div{position:relative;height:18px}
.date .dm div::after{content:"/";position:absolute;right:-3px;bottom:0;color:var(--ink)}
.date .dm div:last-child::after{display:none}
.dcols{display:grid;grid-template-columns:1.12fr 1fr;gap:22px;margin-top:16px}
.sec{margin-bottom:14px}
.sec .lbl{padding-bottom:4px;border-bottom:1.5px solid var(--ink);display:flex;justify-content:space-between;align-items:baseline}
.sec .lbl em{font-style:normal;color:var(--muted);letter-spacing:.1em;font-size:5.5px}
.row{height:15.5px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px}
.row .n{font:400 8px 'Archivo Black';color:var(--brand);width:8px}
.row .c{width:7px;height:7px;border:1px solid var(--ink);border-radius:50%;flex:none}
.box{border:1px solid var(--ink);height:44px;margin-top:6px}
.box.win{height:58px;position:relative}
.box.win .iso{position:absolute;right:6px;top:6px;width:10px;height:10px;color:var(--brand)}
.agenda .row{gap:0}
.agenda .row .h{width:30px;font:400 6px 'JetBrains Mono';color:var(--muted);border-right:1px solid var(--ink);height:100%;display:flex;align-items:center}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:0 10px;margin-top:2px}
.kpi div{height:22px;border-bottom:1px solid var(--line);display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:3px;font:500 5.6px 'JetBrains Mono';letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.water{display:flex;justify-content:space-between;margin-top:8px;padding:0 2px}
.water svg{width:9px;height:12px}
.dots{height:168px;margin-top:6px;background-image:radial-gradient(circle,#8f98a8 .9px,transparent 1.15px);background-size:9px 9px;background-position:-3px -3px}

/* blank */
.blank .mark{opacity:.25}

/* tag for spec */
.cov.opt{display:flex;align-items:center;justify-content:center}

@media (max-width:760px){
  .top{padding:10px 14px}
  .brand .lg{width:72px;height:36px}
  .brand .t{font-size:9px}
  .swatches>span{display:none}
  .sw{width:18px;height:18px}.swatches{gap:6px}
  .brand .t{display:none}
  .hint{display:none}
  .chips{display:none}
  .count{min-width:118px;font-size:10.5px;line-height:1.45}
  .scrub{display:block}
  .nav{gap:12px}
}
body.short .top{padding:6px 14px!important}
body.short .brand .lg{width:60px;height:30px}
body.short .brand .t,body.short .chips,body.short .hint,body.short .scrub{display:none}
body.short .nav{padding:4px 16px calc(6px + env(safe-area-inset-bottom))}
body.short .btn{width:36px;height:36px}
body.short .count br{display:none}
body.short .count b::after{content:" · "}
/* OG render */
body.og .top,body.og .nav,body.og .hint{display:none}
body.og .stage{left:500px!important;right:20px!important;top:0!important;bottom:0!important}
.oghead{display:none}
body.og .oghead{display:block;position:fixed;left:72px;top:50%;transform:translateY(-50%);width:420px}
.oghead .lg{width:150px;height:75px;background:#fff;-webkit-mask:url(logo.png) left center/contain no-repeat;mask:url(logo.png) left center/contain no-repeat;margin-bottom:34px}
.oghead h1{font:400 64px/1 'Archivo Black',sans-serif;letter-spacing:-2px;color:#fff}
.oghead h1 em{font-style:normal;color:var(--brand2)}
.oghead p{margin-top:22px;font:500 13px 'JetBrains Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.6)}
@media (max-height:560px){.chips{display:none}}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="lg" aria-label="Ecom Society"></div>
    <div class="t"><b>Planeador diario</b>Propuesta de diseño · 14 × 21,6 cm</div>
  </div>
  <div class="swatches">
    <span>Tapa</span>
    <button class="sw on" data-c="#050810" data-i="#FFFFFF" style="background:#050810" title="Azul noche"></button>
    <button class="sw" data-c="#2B5BFF" data-i="#FFFFFF" style="background:#2B5BFF" title="Azul eléctrico"></button>
    <button class="sw" data-c="#F2F1EF" data-i="#050810" style="background:#F2F1EF" title="Crema"></button>
    <button class="sw" data-c="#1A1D24" data-i="#5fb8ff" style="background:#1A1D24" title="Grafito"></button>
  </div>
</header>

<main class="stage" id="stage">
  <div class="bookwrap" id="wrap">
    <div class="book" id="book">
      <div class="half l" id="L"></div>
      <div class="half r" id="R"></div>
      <div class="leaf" id="leaf"><div class="face front" id="F"></div><div class="face back" id="B"></div></div>
    </div>
  </div>
</main>

<nav class="nav">
  <div class="chips" id="chips"></div>
  <div class="navrow">
    <button class="btn" id="prev" aria-label="Anterior">←</button>
    <div class="count" id="count"></div>
    <button class="btn" id="next" aria-label="Siguiente">→</button>
    <button class="btn sm" id="zbtn" aria-label="Ampliar hoja" title="Ampliar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21M10.5 7.5v6M7.5 10.5h6"/></svg></button>
  </div>
  <input type="range" class="scrub" id="scrub" min="1" value="1" aria-label="Ir a página">
</nav>
<div class="toast" id="toast">Desliza o toca la hoja para pasarla</div>
<div class="zoom" id="zoom"><div class="sizer" id="zsizer"><div class="zin" id="zin"></div></div></div>
<div class="zbar" id="zbar" style="display:none"><button class="btn sm" id="zminus" aria-label="Alejar">−</button><button class="btn sm" id="zplus" aria-label="Acercar">+</button><button class="btn sm" id="zclose" aria-label="Cerrar">✕</button></div>
<div class="oghead"><div class="lg"></div><h1>Planeador<br><em>diario</em></h1><p>Propuesta de diseño · 14 × 21,6 cm</p></div>
<div class="hint">← → teclado · clic en la hoja</div>

<script>
/* ---------- config ---------- */
const HOJAS_DIARIAS = 80;   // 80 hojas = 160 páginas (frente y vuelta)
const HOJAS_BLANCO  = 20;   // 20 hojas = 40 páginas
const YEARS = [2027, 2028];

/* ---------- icons ---------- */
const I = {
  cart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11h10.2L20 7H6.2"/><circle cx="9" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg>',
  bolt:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 2.5 2.9 6 6.6.8-4.9 4.6 1.3 6.6L12 17.2l-5.9 3.3 1.3-6.6L2.5 9.3l6.6-.8z"/></svg>',
  trophy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4M12 14v4M8 21h8M9 18h6"/></svg>',
  chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17 9 11l4 4 8-8"/><path d="M15 7h6v6"/></svg>',
  bulb:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>',
  rocket:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15l-3-3c1-4 4-8 10-9-1 6-5 9-9 10z"/><path d="M9 12H5l2-4h4M12 15v4l4-2v-4"/><path d="M6 16c-1.5 1-2 3-2 4 1 0 3-.5 4-2"/></svg>',
  target:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>',
  drop:'<svg viewBox="0 0 10 13" fill="none" stroke="#0A0F1C" stroke-width=".8"><path d="M5 .8C3.4 3.4 1.2 5.6 1.2 8.2a3.8 3.8 0 0 0 7.6 0C8.8 5.6 6.6 3.4 5 .8z"/></svg>'
};
const iso = (s,c='currentColor',x='') => `<i class="iso" style="display:block;width:${s}px;height:${s}px;color:${c};${x}"></i>`;

/* ---------- page builders ---------- */
const cover = () => `<div class="page cov"><div class="grain"></div><div class="title">PLANEADOR<br>DIARIO<small>EJECUTA · MIDE · ESCALA</small></div><div class="logo"></div></div>`;
const backCover = () => `<div class="page cov backcov"><div class="grain"></div><div class="q">El sistema correcto<br>y la fraternidad correcta.<br>Un día a la vez.</div><div class="logo" style="bottom:70px;width:80px;height:40px;margin-left:-40px"></div><div class="tag">ECOMSOCIETY.ORG</div></div>`;
const guard = () => `<div class="page guard"><div class="pat">${'<i class="iso"></i>'.repeat(84)}</div></div>`;
const owner = () => `<div class="page"><div class="own">${iso(34,'var(--brand)','margin:0 auto 46px')}
  <div class="field"><div class="ln"></div><div class="lbl">Este planeador pertenece a</div></div>
  <div class="field"><div class="ln"></div><div class="lbl">Mi marca / tienda</div></div>
  <div class="grow"><div class="field"><div class="ln"></div><div class="lbl">Fraterno desde</div></div><div class="field"><div class="ln"></div><div class="lbl">Inicio de este planeador</div></div></div>
  <div class="foot">Si lo encuentras, devuélvelo.<br>Aquí adentro hay una marca en construcción.</div></div><div class="mark"></div></div>`;
const quote1 = () => `<div class="page"><div class="quote">Las leyendas<br>del e-commerce<br>se construyen<br><em>un día ejecutado</em><br>a la vez.</div><div class="mark"></div></div>`;
const howTo = () => `<div class="page"><div class="pad"><span class="band">El sistema del día</span>
  <div class="h2">Cómo usar tu<br>planeador</div>
  <p class="lead">Cinco minutos en la mañana, cinco en la noche. Lo que no se planea no se ejecuta, y lo que no se mide no se escala.</p>
  <div class="steps">
   <div class="step"><div class="n">01</div><div><b>Elige tus 3 prioridades</b><span>Las que de verdad mueven la facturación. Si solo hicieras eso hoy, el día habría valido la pena.</span></div></div>
   <div class="step"><div class="n">02</div><div><b>Bloquea tu agenda</b><span>Creativos, lanzamientos, llamadas con proveedores. Lo que tiene hora, se hace.</span></div></div>
   <div class="step"><div class="n">03</div><div><b>Registra tus números</b><span>Ventas, pedidos, inversión y ROAS. Al final del día, sin excusas.</span></div></div>
   <div class="step"><div class="n">04</div><div><b>Anota tu win</b><span>Pequeño o grande. Y compártelo con la fraternidad en la comunidad.</span></div></div>
  </div></div><div class="mark"></div></div>`;
const goals = () => `<div class="page"><div class="pad"><span class="band">Mi norte</span>
  <div class="h2">Lo que voy<br>a lograr</div>
  <div class="gbox"><div class="lbl">Meta de facturación</div><div class="money"><span>$</span><i></i></div>
   <div class="grow" style="margin-top:10px"><div><div class="lbl" style="color:var(--muted)">Mensual</div><i style="display:block;height:20px;border-bottom:1px solid var(--line)"></i></div><div><div class="lbl" style="color:var(--muted)">Fecha límite</div><i style="display:block;height:20px;border-bottom:1px solid var(--line)"></i></div></div></div>
  <div class="gbox"><div class="lbl">¿Por qué lo hago?</div><div class="lines"><i></i><i></i><i></i></div></div>
  <div class="gbox"><div class="lbl">3 hábitos no negociables</div>
   <div class="habit"><span class="ck"></span></div><div class="habit"><span class="ck"></span></div><div class="habit" style="border:0"><span class="ck"></span></div></div>
  <div class="sign"><div><i></i><div class="lbl" style="margin-top:5px;color:var(--muted)">Firma</div></div><div><i></i><div class="lbl" style="margin-top:5px;color:var(--muted)">Fecha</div></div></div>
 </div><div class="mark"></div></div>`;

const C = {navy:'#0A1A3A', blue:'#2B5BFF', sky:'#5fb8ff', cream:'#F2F1EF', green:'#4ade80', coral:'#ff6b5e', sand:'#E8DCC6', ink:'#0A0F1C'};
const stickerSet = [
  [C.blue,'#fff','Día de<br>ventas'],[C.navy,C.sky,'Lanza-<br>miento'],[C.sky,C.ink,'Testeo'],
  [C.green,C.ink,'Escalar'],[C.coral,'#fff','No<br>olvidar'],[C.sand,C.ink,'Gran<br>idea'],
  [C.ink,'#fff','Live'],[C.cream,C.ink,'Reunión'],[C.blue,'#fff','Pagos'],
  [C.navy,'#fff','Récord'],[C.coral,'#fff','Urgente'],[C.green,C.ink,'Meta<br>cumplida'],
];
const iconSet = [[C.blue,'#fff','cart'],[C.green,C.ink,'chart'],[C.sand,C.navy,'bulb'],[C.navy,C.sky,'rocket'],[C.coral,'#fff','trophy'],[C.sky,C.navy,'bolt'],[C.cream,C.blue,'star'],[C.ink,C.green,'target'],[C.blue,'#fff','iso'],[C.coral,'#fff','cart'],[C.navy,C.green,'chart'],[C.sky,C.ink,'star']];
function stickersL(){
  let h='';
  // 6 cols: each sticker twice, side by side
  for(let k=0;k<stickerSet.length;k+=3){
    for(let rep=0;rep<2;rep++) for(let j=k;j<k+3;j++){const [b,f,t]=stickerSet[j];h+=`<div class="dot" style="background:${b};color:${f}">${t}</div>`;}
  }
  for(let k=0;k<12;k+=3){
    for(let rep=0;rep<2;rep++) for(let j=k;j<k+3;j++){const [b,f,ic]=iconSet[j];h+=`<div class="dot" style="background:${b};color:${f}">${ic==='iso'?iso(22):I[ic]}</div>`;}
  }
  return `<div class="page"><div class="stk">${h}</div><div class="mark"></div></div>`;
}
function stickersR(){
  const tabs=[[C.blue,'#fff','cart'],[C.sand,C.navy,'bulb'],[C.green,C.ink,'chart'],[C.navy,C.sky,'rocket'],[C.coral,'#fff','star'],[C.sky,C.navy,'bolt']];
  const col=(o)=>tabs.map((t,i)=>{const [b,f,ic]=tabs[(i+o)%tabs.length];return `<div class="tab" style="background:${b};color:${f}">${I[ic]}</div>`}).join('');
  return `<div class="page"><div class="tabs-head"><span class="lbl" style="color:#fff">Marcadores</span></div>
   <div class="tabs-txt">Marca las hojas que no puedes perder: lanzamientos, récords de ventas, ideas de producto y días clave.</div>
   <div class="tabs"><div class="tabcol">${col(0)}</div><div class="tabcol">${col(3)}</div></div><div class="mark"></div></div>`;
}
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function calendar(y){
  let h='';
  for(let m=0;m<12;m++){
    const first=(new Date(y,m,1).getDay()+6)%7, days=new Date(y,m+1,0).getDate();
    let g='LMMJVSD'.split('').map(d=>`<span class="d">${d}</span>`).join('');
    for(let i=0;i<first;i++) g+='<span></span>';
    for(let d=1;d<=days;d++){const wd=(first+d-1)%7;g+=`<span${wd===6?' class="we"':''}>${d}</span>`;}
    h+=`<div class="mo"><div class="mn">${MESES[m]}</div><div class="gr">${g}</div></div>`;
  }
  return `<div class="page"><div class="calhead">${y}</div><div class="cal">${h}</div><div class="mark"></div></div>`;
}
const rows=(n,cls='')=>Array.from({length:n},(_,i)=>`<div class="row">${cls==='n'?`<span class="n">${i+1}</span>`:cls==='c'?'<span class="c"></span>':''}</div>`).join('');
function daily(){
  const hours=['6','8','10','12','14','16','18','20'];
  return `<div class="page"><div class="dly">
   <div class="dtop"><span class="band">Planeador del día</span>
    <div class="date"><div class="wk">${'LMMJVSD'.split('').map(d=>`<span>${d}</span>`).join('')}</div><div class="dm"><div>día</div><div>mes</div><div>año</div></div></div></div>
   <div class="dcols">
    <div>
     <div class="sec"><div class="lbl">Top 3 <em>lo que mueve la aguja</em></div>${rows(3,'n')}</div>
     <div class="sec"><div class="lbl">Lista de tareas</div>${rows(18,'c')}</div>
     <div class="sec" style="margin-bottom:0"><div class="lbl">Win del día</div><div class="box win">${iso(10,'var(--brand)','position:absolute;right:6px;top:6px')}</div></div>
    </div>
    <div>
     <div class="sec"><div class="lbl">Intención del día</div><div class="box" style="height:40px"></div></div>
     <div class="sec agenda"><div class="lbl">Hora <em>agenda</em></div>${hours.map(h=>`<div class="row"><span class="h">${h}:00</span></div>`).join('')}</div>
     <div class="sec"><div class="lbl">Mis números</div><div class="kpi"><div>Ventas $</div><div>Pedidos</div><div>Inversión</div><div>ROAS</div></div></div>
     <div class="sec" style="margin-bottom:8px"><div class="lbl">Mi hidratación</div><div class="water">${I.drop.repeat(8)}</div></div>
     <div class="sec" style="margin:0"><div class="lbl">Notas</div><div class="dots"></div></div>
    </div>
   </div></div><div class="mark"></div></div>`;
}
const quote2 = () => `<div class="page"><div class="quote" style="top:32%">Tu próxima<br>marca puede<br>empezar en una<br><em>hoja en blanco.</em></div><div class="mark"></div></div>`;
const blank = () => `<div class="page blank"><div class="mark"></div></div>`;

/* ---------- page list ---------- */
const P=[], SECT=[];
const add=(fn,n=1)=>{for(let i=0;i<n;i++)P.push(fn)};
const sect=(name)=>SECT.push([name,P.length]);
sect('Tapa'); add(cover);
add(guard,2);
sect('Inicio'); add(owner); add(quote1);
sect('El sistema'); add(howTo); add(goals);
sect('Stickers'); add(stickersL); add(stickersR);
sect('Calendarios'); add(()=>calendar(YEARS[0])); add(()=>calendar(YEARS[1]));
sect('Planeación diaria'); add(daily, HOJAS_DIARIAS*2);
sect('Hojas en blanco'); add(quote2); add(blank, HOJAS_BLANCO*2-1);
add(guard,2);
sect('Contratapa'); add(backCover);
const N=P.length; // par → la contratapa queda sola a la izquierda
const label=(i)=>{ if(i===0)return 'Tapa'; if(i===N-1)return 'Contratapa';
  const d0=SECT.find(s=>s[0]==='Planeación diaria')[1], b0=SECT.find(s=>s[0]==='Hojas en blanco')[1];
  if(i>=d0&&i<b0) return `Diario ${i-d0+1}/${HOJAS_DIARIAS*2}`;
  if(i>=b0&&i<b0+HOJAS_BLANCO*2) return `En blanco ${i-b0+1}/${HOJAS_BLANCO*2}`;
  for(let k=SECT.length-1;k>=0;k--) if(i>=SECT[k][1]) return SECT[k][0]; };
const html=(i)=> (i>=0&&i<N)?P[i]():'';

/* ---------- viewer ---------- */
const $=id=>document.getElementById(id);
const L=$('L'),R=$('R'),leaf=$('leaf'),F=$('F'),B=$('B'),book=$('book'),wrap=$('wrap');
let single=false, s=0, busy=false;
const maxS=()=> single? N-1 : N/2;
const OG = location.hash.includes('og');
if(OG) document.body.classList.add('og');
function fit(){
  document.body.classList.toggle('short', innerHeight<=520 && !OG);
  single = !OG && innerWidth<=760 && innerHeight>innerWidth;
  const st=$('stage');
  if(!OG){ const tH=document.querySelector('.top').offsetHeight, nH=document.querySelector('.nav').offsetHeight;
    st.style.top=tH+'px'; st.style.bottom=nH+'px'; }
  const w = single?420:840;
  const sc = Math.min((st.clientWidth-(single?24:56))/w, (st.clientHeight-(single?12:24))/648, 1.35);
  book.style.width=w+'px';
  wrap.style.transform=`scale(${sc})`; wrap.style.width=w+'px'; wrap.style.height='648px'; wrap.style.flex='none';
}
function shift(){
  if(single){book.style.transform='';return}
  book.style.transform = s===0?'translateX(-210px)': s===maxS()?'translateX(210px)':'';
}
function draw(){
  if(single){ L.innerHTML=''; R.style.left='0'; R.innerHTML=html(s); }
  else { R.style.left='420px'; L.innerHTML = s===0?'':html(2*s-1); R.innerHTML=html(2*s); }
  shift(); ui();
}
function ui(){
  $('prev').disabled = s<=0; $('next').disabled = s>=maxS();
  let a,b;
  if(single){a=s;b=null}else{a=s===0?0:2*s-1;b=(s===0||2*s>=N)?null:2*s}
  const pg = b===null?`${a+1}`:`${a+1}–${b+1}`;
  let lb=label(b??a); if(b!==null){ const la=label(a), m=/^(.*) (\d+)\/(\d+)$/.exec(la), m2=/^(.*) (\d+)\/(\d+)$/.exec(lb); if(m&&m2&&m[1]===m2[1]) lb=`${m[1]} ${m[2]}–${m2[2]}/${m[3]}`; }
  $('count').innerHTML = `<b>${lb}</b><br>pág. ${pg} de ${N}`;
  $('scrub').value = (single? s : (s===0?0:2*s-1))+1;
  const cur = single? s : (s===0?0:2*s-1);
  let on=0; SECT.forEach((x,k)=>{ if(cur>=x[1]) on=k });
  document.querySelectorAll('.chip').forEach((c,k)=>c.classList.toggle('on',k===on));
}
function anim(dir){
  if(busy) return;
  if(dir>0 && s>=maxS() || dir<0 && s<=0) return;
  busy=true;
  const D=700;
  leaf.style.transition='none'; leaf.style.display='block'; leaf.classList.remove('mid');
  if(single){
    leaf.style.left='0';
    if(dir>0){ F.innerHTML=html(s); B.innerHTML=''; R.innerHTML=html(s+1); leaf.style.transformOrigin='left center'; leaf.style.transform='rotateY(0deg)'; }
    else { F.innerHTML=html(s-1); B.innerHTML=''; leaf.style.transformOrigin='left center'; leaf.style.transform='rotateY(-100deg)'; }
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      leaf.style.transition=`transform ${D}ms cubic-bezier(.45,.05,.25,1)`; leaf.classList.add('mid');
      leaf.style.transform = dir>0?'rotateY(-100deg)':'rotateY(0deg)';
    }));
  } else if(dir>0){
    leaf.style.left='420px'; leaf.style.transformOrigin='left center'; leaf.style.transform='rotateY(0deg)';
    F.innerHTML=html(2*s); B.innerHTML=html(2*s+1); R.innerHTML=html(2*s+2);
    if(s+1===maxS()) book.style.transform='translateX(210px)'; else if(s===0) book.style.transform='';
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      leaf.style.transition=`transform ${D}ms cubic-bezier(.45,.05,.25,1)`; leaf.classList.add('mid'); leaf.style.transform='rotateY(-180deg)';
    }));
  } else {
    leaf.style.left='0'; leaf.style.transformOrigin='right center'; leaf.style.transform='rotateY(0deg)';
    F.innerHTML=html(2*s-1); B.innerHTML=html(2*s-2); L.innerHTML = s-1>=1?html(2*s-3):'';
    if(s-1===0) book.style.transform='translateX(-210px)'; else if(s===maxS()) book.style.transform='';
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      leaf.style.transition=`transform ${D}ms cubic-bezier(.45,.05,.25,1)`; leaf.classList.add('mid'); leaf.style.transform='rotateY(180deg)';
    }));
  }
  setTimeout(()=>{ s+=dir; leaf.style.display='none'; F.innerHTML=B.innerHTML=''; draw(); busy=false; }, D+20);
}
function jump(pageIdx){ s = single? pageIdx : Math.ceil(pageIdx/2); s=Math.max(0,Math.min(maxS(),s)); draw(); }

$('scrub').max=N;
$('scrub').oninput=e=>jump(+e.target.value-1);
const Z=$('zoom'); let zl=0;
function zoomDraw(){
  const idx = single? [s] : (s===0?[0]:[2*s-1,2*s].filter(i=>i<N));
  const w=420*idx.length, base=Math.min((innerWidth-16)/w, 3), z=base*[1,1.8,2.6][zl];
  $('zin').style.width=w+'px'; $('zin').innerHTML=idx.map((i,k)=>`<div class="zp" style="left:${k*420}px">${html(i)}</div>`).join('');
  $('zin').style.transform=`scale(${z})`;
  $('zsizer').style.width=w*z+'px'; $('zsizer').style.height=648*z+'px';
  $('zsizer').style.margin = (Math.max(64,(innerHeight-648*z)/2))+'px auto 40px';
  $('zminus').disabled=zl===0; $('zplus').disabled=zl===2;
}
$('zbtn').onclick=()=>{ zl= single?1:0; Z.classList.add('on'); $('zbar').style.display='flex'; zoomDraw(); Z.scrollTop=0; Z.scrollLeft=0; };
$('zclose').onclick=()=>{ Z.classList.remove('on'); $('zbar').style.display='none'; $('zin').innerHTML=''; };
$('zplus').onclick=()=>{ if(zl<2){zl++;zoomDraw()} };
$('zminus').onclick=()=>{ if(zl>0){zl--;zoomDraw()} };
addEventListener('keydown',e=>{ if(e.key==='Escape') $('zclose').click(); });
$('next').onclick=()=>anim(1); $('prev').onclick=()=>anim(-1);
addEventListener('keydown',e=>{ if(Z.classList.contains('on'))return; if(e.key==='ArrowRight')anim(1); if(e.key==='ArrowLeft')anim(-1); });
book.addEventListener('click',e=>{ const r=book.getBoundingClientRect(); (e.clientX-r.left > r.width/2)?anim(1):anim(-1); });
let tx=null; addEventListener('touchstart',e=>{ tx = (Z.classList.contains('on')||e.target.closest('.nav'))? null : e.touches[0].clientX; },{passive:true});
addEventListener('touchend',e=>{ if(tx===null)return; const dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>40) anim(dx<0?1:-1); tx=null; });
$('chips').innerHTML = SECT.map(([n,i])=>`<button class="chip" data-i="${i}">${n}</button>`).join('');
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>jump(+c.dataset.i));
document.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.sw').forEach(x=>x.classList.remove('on')); b.classList.add('on');
  document.documentElement.style.setProperty('--cover',b.dataset.c); document.documentElement.style.setProperty('--cover-ink',b.dataset.i);
});
addEventListener('resize',()=>{ const was=single; fit(); if(Z.classList.contains('on')) zoomDraw(); if(was!==single){ const p = was? s : (s===0?0:2*s-1); jump(p); } });
fit(); draw();
if(document.fonts) document.fonts.ready.then(fit);
if(single){ setTimeout(()=>$('toast').classList.add('on'),900); setTimeout(()=>$('toast').classList.remove('on'),3600); }
const hp=/p=(\d+)/.exec(location.hash); if(hp) jump(+hp[1]-1);
</script>
</body>
</html>
